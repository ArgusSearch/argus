[project]
name = "argus"
version = "0.1.0"
description = "Argus, the analyst that never sleeps: autonomous metric monitoring and root-cause investigation over a typed metric graph."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "fastapi>=0.115",
    "numpy>=2.0",
    "pandas>=2.2",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "sqlglot>=25.0",
    "uvicorn>=0.30",
]

[project.scripts]
mockmart = "mockmart.cli:main"
argus = "argus.cli:main"
argus-bench = "bench.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/argus", "src/mockmart", "src/bench"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["e2e: end-to-end scenario tests (slower, run the full sim plus Argus loop)"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
